<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laivy Hart</title>
<script>
  /* Set the lighting before first paint to avoid a flash. */
  (function(){
    try{
      var t = localStorage.getItem('laivy-theme');
      if(!t){ t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
  })();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#140810" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5ECEE" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Laivy Hart">
<script src="pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  body{height:100vh; overflow:hidden;}
  .app{
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:16px;
    height:100vh;
    padding:16px;
  }
  .panel{position:relative; overflow:hidden; display:flex; flex-direction:column;}

  /* content sits above the ambient wash */
  .panel > *:not(.ambient){position:relative; z-index:1;}

  /* ---------- LEFT: now playing ---------- */
  .now{padding:1.3rem 1.5rem;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:0.8rem;}
  .topbar-right{display:flex; align-items:center; gap:0.8rem;}

  .now-topline{display:flex; align-items:center; gap:0.9rem; margin-top:1.35rem;}
  .now-thumb{
    width:52px; height:52px; border-radius:12px; flex-shrink:0;
    background-size:cover; background-position:center;
    border:1px solid var(--glass-border);
    box-shadow:0 6px 18px rgba(0,0,0,0.28);
  }
  .now-titles{min-width:0; text-align:left;}
  .now-title-primary{
    font-size:1.65rem; line-height:1.18; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .now-title-secondary{
    font-family:var(--font-display);
    font-size:1.02rem; font-style:italic; color:var(--text-dim);
    line-height:1.2; margin-top:0.05rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .heb{font-family:var(--font-heb); direction:rtl;}
  .disp{font-family:var(--font-display);}

  .now-chips{display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.9rem;}
  .now-chips .chip{cursor:default; text-transform:none; letter-spacing:0.02em;}

  .pullquote{
    margin:1.15rem 0 0; padding:0.55rem 0 0.55rem 1rem;
    border-left:3px solid transparent;
    border-image:var(--accent-grad) 1;
    color:var(--text);
    font-family:var(--font-display);
    font-size:1.02rem; font-style:italic; line-height:1.5;
  }
  .pullquote .lbl{
    display:block; font-family:var(--font-ui); font-style:normal;
    font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:0.3rem;
  }

  /* lyrics hero */
  .lyrics-wrap{flex:1; min-height:0; display:flex; flex-direction:column; margin-top:1.15rem;}
  .lyrics-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:0.5rem;}
  .lyrics-head .lbl{font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint);}
  .lang-toggle{display:flex; gap:0.3rem;}
  .lang-toggle button{
    font-family:var(--font-ui); font-size:0.66rem; letter-spacing:0.05em; text-transform:uppercase;
    padding:0.28rem 0.62rem; border-radius:16px; cursor:pointer;
    background:transparent; border:1px solid var(--chip-border); color:var(--text-dim);
    transition:all 0.2s var(--ease);
  }
  .lang-toggle button.active{background:var(--accent-grad); border-color:transparent; color:#fff;}
  .lyrics-scroll{flex:1; min-height:0; overflow-y:auto; padding-right:0.5rem;}
  .lyrics{font-size:1.45rem; line-height:1.95; white-space:pre-line; font-family:var(--font-display);}
  .lyrics.is-heb{font-family:var(--font-heb); direction:rtl; text-align:right; font-size:1.7rem; line-height:1.85;}
  .lyrics.hidden{display:none;}
  .now-empty{margin:auto; text-align:center; color:var(--text-faint); font-family:var(--font-display); font-style:italic; font-size:1.1rem; max-width:22rem;}

  /* player dock */
  .dock{
    margin-top:1rem; padding-top:1rem; border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:0.7rem;
  }
  .scrub-row{display:flex; align-items:center; gap:0.7rem;}
  .scrub-row time{font-family:var(--font-ui); font-size:0.68rem; color:var(--text-dim); min-width:3.1em; text-align:center;}
  input.scrub{
    -webkit-appearance:none; appearance:none; flex:1; height:5px; border-radius:5px; cursor:pointer;
    background:var(--line); outline:none;
  }
  input.scrub::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent-2); border:2px solid var(--bg); cursor:pointer;
  }
  input.scrub::-moz-range-thumb{width:12px; height:12px; border-radius:50%; background:var(--accent-2); border:2px solid var(--bg); cursor:pointer;}
  .transport{display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;}
  .tbtn{
    width:2.4rem; height:2.4rem; border-radius:50%; flex-shrink:0;
    border:1px solid var(--glass-border); background:var(--glass-hi); color:var(--text);
    cursor:pointer; font-size:0.95rem; display:inline-flex; align-items:center; justify-content:center;
    transition:transform 0.2s var(--ease);
  }
  .tbtn:hover{transform:translateY(-1px);}
  .tbtn.play{width:3rem; height:3rem; font-size:1.1rem; background:var(--play-bg); color:var(--play-fg); border:none; box-shadow:0 6px 18px rgba(158,43,78,0.45);}
  .dock-right{margin-left:auto; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;}
  .radio-btn{
    font-family:var(--font-ui); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em;
    padding:0.45rem 0.8rem; border-radius:16px; cursor:pointer;
    background:var(--chip-bg); border:1px solid var(--chip-border); color:var(--text-dim);
    transition:all 0.2s var(--ease);
  }
  .radio-btn.active{background:var(--accent-grad); border-color:transparent; color:#fff;}
  .cat-radio{
    font-family:var(--font-ui); font-size:0.68rem; padding:0.42rem 0.6rem; border-radius:14px;
    background:var(--chip-bg); border:1px solid var(--chip-border); color:var(--text-dim); cursor:pointer; max-width:11rem;
  }

  /* ---------- RIGHT: browse ---------- */
  .browse{padding:1.1rem 1.1rem 0.4rem;}
  .tabs{display:flex; gap:0.4rem; margin-bottom:0.9rem;}
  .tab{
    font-family:var(--font-ui); font-size:0.74rem; text-transform:uppercase; letter-spacing:0.06em;
    padding:0.5rem 0.9rem; border-radius:14px; cursor:pointer;
    background:transparent; border:1px solid transparent; color:var(--text-dim);
  }
  .tab.active{background:var(--glass-hi); border-color:var(--glass-border); color:var(--text);}

  .controls{display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.8rem;}
  .search{
    width:100%; background:var(--chip-bg); border:1px solid var(--chip-border); border-radius:12px;
    padding:0.6rem 0.9rem; font-family:var(--font-ui); font-size:0.92rem; color:var(--text);
  }
  .search:focus{outline:none; border-color:var(--accent-2);}
  .search::placeholder{color:var(--text-faint);}
  .filter-pills{display:flex; gap:0.4rem; flex-wrap:wrap; max-height:4.6rem; overflow-y:auto;}

  .rows{flex:1; min-height:0; overflow-y:auto; margin-right:-0.3rem; padding-right:0.3rem;}
  /* Art-free rows: whisper metadata left, titles carry the weight on the right. */
  .row{
    display:flex; align-items:center; gap:1rem;
    padding:0.82rem 0.5rem; border-bottom:1px solid var(--line); cursor:pointer;
    transition:background 0.18s var(--ease);
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:var(--glass-hi);}
  .row.playing{background:var(--glass-hi);}
  .row.playing .row-title-primary{color:var(--accent-2);}
  .row-meta{display:flex; flex-direction:column; gap:0.14rem; text-align:left; flex-shrink:0; min-width:2.6rem;}
  .row-cat{
    font-family:var(--font-ui); font-size:0.62rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:9rem;
  }
  .row-len{font-family:var(--font-ui); font-size:0.66rem; color:var(--text-faint); display:flex; align-items:center; gap:0.35rem;}
  .row-titles{margin-left:auto; text-align:right; min-width:0; display:flex; flex-direction:column; gap:0.05rem;}
  .row-title-primary{font-size:1.2rem; line-height:1.28; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-title-primary.he{font-family:var(--font-heb); direction:rtl; font-weight:500;}
  .row-title-primary.en{font-family:var(--font-display); font-weight:600;}
  .row-title-secondary{
    font-family:var(--font-display); font-style:italic; font-size:0.8rem; line-height:1.28;
    color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row-add{
    width:1.8rem; height:1.8rem; border-radius:50%; border:1px solid var(--chip-border);
    background:var(--chip-bg); color:var(--text-dim); cursor:pointer; font-size:1rem; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:border-color 0.18s var(--ease), color 0.18s var(--ease);
  }
  .row-add:hover{border-color:var(--accent-2); color:var(--text);}
  .row-add.added{border-color:var(--accent-2); color:var(--accent-2);}

  .muted{color:var(--text-faint); font-family:var(--font-ui); font-size:0.85rem; padding:2rem 0.5rem; text-align:center;}

  /* playlists */
  .pl-new{display:flex; gap:0.5rem; margin-bottom:0.9rem;}
  .pl-new input{flex:1; background:var(--chip-bg); border:1px solid var(--chip-border); border-radius:12px; padding:0.55rem 0.8rem; font-family:var(--font-ui); font-size:0.88rem; color:var(--text);}
  .pl-new input:focus{outline:none; border-color:var(--accent-2);}
  .pl-new button{font-family:var(--font-ui); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; padding:0.5rem 0.9rem; border-radius:12px; border:none; background:var(--accent-grad); color:#fff; cursor:pointer;}
  .pl-card{border:1px solid var(--line); border-radius:14px; padding:0.7rem 0.8rem; margin-bottom:0.6rem;}
  .pl-card-head{display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap;}
  .pl-mini.primary{background:var(--accent-grad); border-color:transparent; color:#fff;}
  .pl-mini.primary:hover{filter:brightness(1.08); color:#fff; border-color:transparent;}
  .pl-name{flex:1; font-family:var(--font-display); font-size:1rem; font-style:italic;}
  .pl-count{font-family:var(--font-ui); font-size:0.68rem; color:var(--text-faint);}
  .pl-mini{font-family:var(--font-ui); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.04em; padding:0.25rem 0.55rem; border-radius:10px; border:1px solid var(--chip-border); background:transparent; color:var(--text-dim); cursor:pointer;}
  .pl-mini:hover{color:var(--text); border-color:var(--accent-2);}
  .pl-mini.danger:hover{border-color:var(--accent-1); color:var(--accent-1);}
  .pl-songs{margin-top:0.55rem; display:flex; flex-direction:column; gap:0.25rem;}
  .pl-song{display:flex; align-items:center; gap:0.5rem; font-size:0.82rem; color:var(--text-dim); padding:0.2rem 0;}
  .pl-song .t{flex:1; font-family:var(--font-heb); direction:rtl; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pl-song .t.en{font-family:var(--font-display); direction:ltr; font-style:italic;}
  .pl-song .x{cursor:pointer; color:var(--text-faint); border:none; background:none; font-size:0.9rem;}
  .pl-song .x:hover{color:var(--accent-1);}

  /* add-to-playlist popover */
  .add-menu{
    position:absolute; z-index:50; min-width:11rem; max-width:14rem;
    background:var(--bg-2); border:1px solid var(--glass-border); border-radius:12px;
    box-shadow:0 16px 40px rgba(0,0,0,0.45); padding:0.4rem;
  }
  .add-menu button{
    display:block; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    font-family:var(--font-ui); font-size:0.82rem; color:var(--text); padding:0.45rem 0.55rem; border-radius:8px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .add-menu button:hover{background:var(--glass-hi);}
  .add-menu .sep{height:1px; background:var(--line); margin:0.3rem 0;}
  .add-menu .new{color:var(--accent-2);}

  /* Playlist song picker (playlist-first add flow) */
  .picker-overlay{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; padding:1rem;}
  .picker{width:min(30rem, 100%); max-height:82vh; display:flex; flex-direction:column; padding:1.1rem; background:var(--bg-2); border:1px solid var(--glass-border);}
  .picker-head{display:flex; align-items:center; justify-content:space-between; gap:0.5rem; margin-bottom:0.7rem;}
  .picker-title{font-family:var(--font-display); font-size:1.05rem;}
  .picker-title span{font-style:italic; color:var(--accent-2);}
  #picker-search{margin-bottom:0.7rem; flex-shrink:0;}
  .picker-list{flex:1; min-height:0; overflow-y:auto;}
  .pick{display:flex; align-items:center; gap:0.7rem; padding:0.55rem 0.35rem; border-bottom:1px solid var(--line); cursor:pointer;}
  .pick:hover{background:var(--glass-hi);}
  .pick-check{width:1.55rem; height:1.55rem; border-radius:50%; border:1px solid var(--chip-border); display:inline-flex; align-items:center; justify-content:center; font-size:0.85rem; color:var(--text-faint); flex-shrink:0;}
  .pick.added .pick-check{background:var(--accent-grad); border-color:transparent; color:#fff;}
  .pick-title{flex:1; min-width:0; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--font-heb); direction:rtl; font-size:1.05rem;}
  .pick-title.en{font-family:var(--font-display); direction:ltr; font-style:italic;}
  .picker-foot{display:flex; align-items:center; justify-content:space-between; margin-top:0.7rem; padding-top:0.7rem; border-top:1px solid var(--line); flex-shrink:0;}

  .hidden{display:none !important;}

  @media (max-width:900px){
    body{height:auto; overflow:auto;}
    .app{grid-template-columns:1fr; height:auto; min-height:100vh;}
    .panel{overflow:visible;}
    .lyrics-scroll{max-height:60vh;}
    .rows{max-height:70vh;}
  }
</style>
</head>
<body>

<div class="app">

  <!-- ================= LEFT: now playing ================= -->
  <section class="panel now glass">
    <div class="ambient" id="ambient" aria-hidden="true">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    </div>

    <div class="topbar">
      <div class="logo"><span class="l1">LAIVY</span><span class="l2">HART</span></div>
      <div class="topbar-right">
        <a class="quiet-link" href="about.html">About</a>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle light and dark">◐</button>
      </div>
    </div>

    <div id="now-content">
      <div class="now-topline">
        <div class="now-thumb" id="now-thumb"></div>
        <div class="now-titles">
          <div class="now-title-primary" id="now-title-primary"></div>
          <div class="now-title-secondary" id="now-title-secondary"></div>
        </div>
      </div>
      <div class="now-chips" id="now-chips"></div>
      <div class="pullquote hidden" id="now-about"></div>
    </div>

    <div class="lyrics-wrap">
      <div class="lyrics-head">
        <span class="lbl">Lyrics</span>
        <div class="lang-toggle" id="lang-toggle"></div>
      </div>
      <div class="lyrics-scroll" id="lyrics-scroll">
        <div class="now-empty" id="now-empty">Pick a song, hit Radio, or spin a category to begin.</div>
        <div class="lyrics is-heb hidden" id="lyrics-orig"></div>
        <div class="lyrics hidden" id="lyrics-trans"></div>
      </div>
    </div>

    <div class="dock">
      <div class="scrub-row">
        <time id="t-elapsed">0:00</time>
        <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" aria-label="Seek">
        <time id="t-remaining">0:00</time>
      </div>
      <div class="transport">
        <button class="tbtn" id="prev-btn" aria-label="Previous">&#9198;</button>
        <button class="tbtn play" id="play-btn" aria-label="Play or pause">&#9654;</button>
        <button class="tbtn" id="next-btn" aria-label="Next">&#9197;</button>
        <div class="dock-right">
          <button class="radio-btn" id="radio-btn">Radio</button>
          <select class="cat-radio" id="cat-radio-select"><option value="">Category radio</option></select>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= RIGHT: browse ================= -->
  <section class="panel browse glass">
    <div class="tabs">
      <button class="tab active" id="tab-songs">Songs</button>
      <button class="tab" id="tab-playlists">Playlists</button>
    </div>

    <div id="songs-panel" style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <div class="controls">
        <input class="search" id="search" type="text" placeholder="Search a title, category, or word" aria-label="Search songs">
        <div class="filter-pills" id="filter-pills"></div>
      </div>
      <div class="rows" id="rows"></div>
    </div>

    <div id="playlists-panel" class="hidden" style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <div class="pl-new">
        <input type="text" id="pl-name" placeholder="New playlist name" aria-label="New playlist name">
        <button id="pl-add">Create</button>
      </div>
      <div class="rows" id="playlists-body"></div>
    </div>
  </section>

</div>

<div class="picker-overlay hidden" id="picker-overlay">
  <div class="picker glass">
    <div class="picker-head">
      <div class="picker-title">Add to <span id="picker-plname"></span></div>
      <button class="icon-btn" id="picker-close" aria-label="Close">&times;</button>
    </div>
    <input class="search" id="picker-search" type="text" placeholder="Search songs to add" aria-label="Search songs to add">
    <div class="picker-list" id="picker-list"></div>
    <div class="picker-foot">
      <span class="pl-count" id="picker-count"></span>
      <button class="pl-mini primary" id="picker-done">Done</button>
    </div>
  </div>
</div>

<audio id="audio-el"></audio>

<script>
/* ============================================================
   Config, client, flags
   ============================================================ */
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.LAIVY_CONFIG;
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Play counts are tracked silently. Flip to true to reveal them publicly.
const SHOW_PLAY_COUNTS = false;

/* ============================================================
   Small utilities
   ============================================================ */
function escHtml(str){ return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatLength(secs){
  if(secs === null || secs === undefined || secs === '') return '';
  const n = Number(secs);
  if(!isFinite(n) || n <= 0) return '';
  return Math.floor(n/60) + ':' + String(Math.round(n%60)).padStart(2,'0');
}
function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  return Math.floor(sec/60) + ':' + String(Math.floor(sec%60)).padStart(2,'0');
}

function hashStr(s){
  let h = 0; s = s || 'laivy';
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
// Deterministic generative art in the Bordeaux family, seeded from the title.
function genArtStyle(seed){
  const h = hashStr(seed);
  const a = 300 + (h % 60);
  const b = 260 + ((h>>3) % 80);
  const x1 = 12 + (h % 55), y1 = 12 + ((h>>2)%55);
  const x2 = 45 + ((h>>4)%50), y2 = 40 + ((h>>5)%55);
  const c1 = `hsl(${a} 66% 46%)`, c2 = `hsl(${b} 60% 42%)`;
  const base1 = `hsl(${(a+b)>>1} 45% 20%)`, base2 = `hsl(${a} 42% 12%)`;
  return `background:radial-gradient(60% 60% at ${x1}% ${y1}%, ${c1}, transparent 70%),`
       + `radial-gradient(55% 55% at ${x2}% ${y2}%, ${c2}, transparent 70%),`
       + `linear-gradient(135deg, ${base1}, ${base2});`;
}

/* ============================================================
   Theme toggle (persisted)
   ============================================================ */
const themeToggle = document.getElementById('theme-toggle');
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('laivy-theme', next); }catch(e){}
});

/* ============================================================
   Data
   ============================================================ */
let SONGS = [];

const DUR_KEY = 'laivy-durations-v1';
let durCache = loadDurCache();
function loadDurCache(){ try{ return JSON.parse(localStorage.getItem(DUR_KEY)) || {}; }catch(e){ return {}; } }
function saveDurCache(){ try{ localStorage.setItem(DUR_KEY, JSON.stringify(durCache)); }catch(e){} }

function mapSong(r){
  return {
    id: r.id,
    language: r.language || 'Hebrew',
    title: r.title || '',
    title_translit: r.title_translit || '',
    categories: Array.isArray(r.categories) ? r.categories : [],
    length: formatLength(r.length_seconds) || (durCache[r.id] ? formatLength(durCache[r.id]) : ''),
    about: r.about || '',
    lyrics_original: r.lyrics_original || '',
    lyrics_translation: r.lyrics_translation || '',
    audio: r.audio_url || '',
    cover: r.cover_url || '',
    play_count: r.play_count || 0
  };
}
function isHebrew(s){ return (s.language || 'Hebrew') === 'Hebrew'; }

async function loadSongs(){
  const { data, error } = await supabaseClient.from('songs').select('*').order('title');
  if(error){
    console.error(error);
    document.getElementById('rows').innerHTML = `<div class="muted">Couldn't load songs right now. Please refresh.</div>`;
    return;
  }
  SONGS = (data || []).map(mapSong);
  renderFilterPills();
  renderList();
  renderNow();
  renderPlaylists();
  fetchMissingDurations();
}

/* ============================================================
   Auto-read song durations from audio metadata (cached in localStorage,
   keyed by song id). No manual length entry needed; songs without a
   playable file simply never get a length.
   ============================================================ */
let durQueue = [], durBusy = false, rowsRefreshTimer = null;
function scheduleRowsRefresh(){ clearTimeout(rowsRefreshTimer); rowsRefreshTimer = setTimeout(renderList, 140); }
function fetchMissingDurations(){
  durQueue = SONGS.filter(s => s.audio && !durCache[s.id]);
  if(!durBusy) processDurQueue();
}
function processDurQueue(){
  if(durQueue.length === 0){ durBusy = false; return; }
  durBusy = true;
  const s = durQueue.shift();
  const probe = new Audio();
  probe.preload = 'metadata';
  let done = false;
  const finish = () => { if(done) return; done = true; try{ probe.src = ''; }catch(e){} processDurQueue(); };
  probe.addEventListener('loadedmetadata', () => {
    if(isFinite(probe.duration) && probe.duration > 0){
      durCache[s.id] = Math.round(probe.duration);
      saveDurCache();
      s.length = formatLength(durCache[s.id]);
      scheduleRowsRefresh();
    }
    finish();
  });
  probe.addEventListener('error', finish);
  setTimeout(finish, 15000);
  probe.src = s.audio;
}

/* ============================================================
   State
   ============================================================ */
let activeCat = 'all';
let searchTerm = '';
let currentIdx = null;
let langView = 'orig';   // 'orig' | 'trans'
let mode = 'manual';     // manual | radio | catRadio | playlist
let queue = [];
let queuePos = 0;
let idleTimer = null;
let playCounted = false;

const audioEl = document.getElementById('audio-el');
const ambient = document.getElementById('ambient');

/* ============================================================
   Covers and thumbnails
   ============================================================ */
function thumbStyle(song){
  if(song.cover){
    return `background-image:url("${song.cover}");`;
  }
  return genArtStyle(song.title || song.title_translit || song.id);
}

/* ============================================================
   Categories and filtering
   ============================================================ */
function allCategories(){
  const set = new Set();
  SONGS.forEach(s => s.categories.forEach(c => set.add(c)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function renderFilterPills(){
  const el = document.getElementById('filter-pills');
  let html = `<button class="chip ${activeCat==='all'?'active':''}" data-cat="all">All</button>`;
  allCategories().forEach(c => {
    html += `<button class="chip ${activeCat===c?'active':''}" data-cat="${escHtml(c)}">${escHtml(c)}</button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => { activeCat = btn.dataset.cat; renderFilterPills(); renderList(); });
  });

  const sel = document.getElementById('cat-radio-select');
  sel.innerHTML = `<option value="">Category radio</option>` +
    allCategories().map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
}
function songMatches(s){
  const inCat = activeCat === 'all' || s.categories.includes(activeCat);
  if(!inCat) return false;
  const term = searchTerm.trim().toLowerCase();
  if(!term) return true;
  const hay = (s.title_translit + ' ' + s.title + ' ' + s.categories.join(' ') + ' ' + s.about).toLowerCase();
  return hay.includes(term);
}

/* ============================================================
   Right column: song rows
   ============================================================ */
function eqHTML(){ return `<span class="eq"><span></span><span></span><span></span><span></span></span>`; }

function renderList(){
  const rows = document.getElementById('rows');
  const filtered = SONGS.map((s,i)=>({s, idx:i})).filter(o => songMatches(o.s));
  if(filtered.length === 0){
    rows.innerHTML = `<div class="muted">Nothing matches. Try another word or clear the filter.</div>`;
    return;
  }
  rows.innerHTML = filtered.map(({s, idx}) => {
    const playing = currentIdx === idx;
    const heb = isHebrew(s);
    // Primary is always the song's own language (bold), secondary is muted below.
    const primary = heb ? s.title : (s.title || s.title_translit);
    const secondary = heb ? s.title_translit : '';
    const cat = s.categories[0] || '';
    return `
      <div class="row ${playing?'playing':''}" data-idx="${idx}">
        <div class="row-meta">
          ${cat ? `<div class="row-cat">${escHtml(cat)}</div>` : ''}
          ${(playing || s.length) ? `<div class="row-len">${playing ? eqHTML() : escHtml(s.length)}</div>` : ''}
          ${SHOW_PLAY_COUNTS ? `<div class="row-len">&#9654; ${s.play_count}</div>` : ''}
        </div>
        <div class="row-titles">
          <div class="row-title-primary ${heb?'he':'en'}">${escHtml(primary)}</div>
          ${secondary ? `<div class="row-title-secondary">${escHtml(secondary)}</div>` : ''}
        </div>
        <button class="row-add" data-idx="${idx}" title="Add to playlist" aria-label="Add to playlist">+</button>
      </div>`;
  }).join('');

  rows.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.row-add')) return;
      mode = 'manual';
      document.getElementById('radio-btn').classList.remove('active');
      loadSong(Number(row.dataset.idx));
    });
  });
  rows.querySelectorAll('.row-add').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openAddMenu(btn, Number(btn.dataset.idx));
    });
  });
}

/* ============================================================
   Left column: now playing
   ============================================================ */
function renderNow(){
  const empty = document.getElementById('now-empty');
  const orig = document.getElementById('lyrics-orig');
  const trans = document.getElementById('lyrics-trans');
  const primary = document.getElementById('now-title-primary');
  const secondary = document.getElementById('now-title-secondary');
  const thumb = document.getElementById('now-thumb');
  const chips = document.getElementById('now-chips');
  const about = document.getElementById('now-about');
  const langToggle = document.getElementById('lang-toggle');

  if(currentIdx === null){
    empty.classList.remove('hidden');
    orig.classList.add('hidden'); trans.classList.add('hidden');
    primary.textContent = ''; secondary.textContent = '';
    thumb.style.cssText = genArtStyle('laivy hart');
    chips.innerHTML = ''; about.classList.add('hidden'); langToggle.innerHTML = '';
    return;
  }
  const s = SONGS[currentIdx];
  const heb = isHebrew(s);
  empty.classList.add('hidden');

  thumb.style.cssText = thumbStyle(s);

  // Titles: primary in the original script, secondary transliteration.
  primary.textContent = heb ? s.title : (s.title || s.title_translit);
  primary.className = 'now-title-primary ' + (heb ? 'heb' : 'disp');
  if(heb && s.title_translit){
    secondary.textContent = s.title_translit;
    secondary.className = 'now-title-secondary disp';
    secondary.style.display = '';
  } else {
    secondary.style.display = 'none';
  }

  chips.innerHTML = s.categories.map(c => `<span class="chip">${escHtml(c)}</span>`).join('');

  if(s.about){
    about.innerHTML = `<span class="lbl">The inspiration</span>${escHtml(s.about)}`;
    about.classList.remove('hidden');
  } else {
    about.classList.add('hidden');
  }

  // Lyrics: original in its own script, translation always Fraunces.
  const hasTrans = !!s.lyrics_translation;
  orig.textContent = s.lyrics_original;
  orig.className = 'lyrics ' + (heb ? 'is-heb' : '');
  trans.textContent = s.lyrics_translation;
  trans.className = 'lyrics';

  // Smart language toggle: only shown when there really are two languages.
  if(hasTrans){
    const origLabel = heb ? 'עברית' : 'English';
    langToggle.innerHTML =
      `<button data-view="orig" class="${langView==='orig'?'active':''}">${origLabel}</button>` +
      `<button data-view="trans" class="${langView==='trans'?'active':''}">EN</button>`;
    langToggle.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => { langView = b.dataset.view; renderNow(); });
    });
  } else {
    langView = 'orig';
    langToggle.innerHTML = '';
  }

  const showTrans = hasTrans && langView === 'trans';
  orig.classList.toggle('hidden', showTrans);
  trans.classList.toggle('hidden', !showTrans);
}

/* ============================================================
   Playback
   ============================================================ */
function setAmbientPlaying(on){ ambient.classList.toggle('is-playing', !!on); }

function loadSong(idx){
  currentIdx = idx;
  langView = 'orig';
  playCounted = false;
  renderNow();
  renderList();
  playCurrent();
}

function playCurrent(){
  if(currentIdx === null) return;
  const s = SONGS[currentIdx];
  clearTimeout(idleTimer);
  if(s.audio){
    audioEl.src = s.audio;
    audioEl.play().catch(()=>{});
    setPlayIcon(true);
    setAmbientPlaying(true);
  } else {
    audioEl.removeAttribute('src'); audioEl.load();
    setPlayIcon(false);
    setAmbientPlaying(false);
    resetScrub();
    // Keep radio and playlists moving even before audio is attached.
    if(mode !== 'manual') idleTimer = setTimeout(advanceQueue, 9000);
  }
}

function setPlayIcon(playing){
  document.getElementById('play-btn').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
}
function resetScrub(){
  document.getElementById('scrub').value = 0;
  document.getElementById('t-elapsed').textContent = '0:00';
  document.getElementById('t-remaining').textContent = '0:00';
}

document.getElementById('play-btn').addEventListener('click', () => {
  if(currentIdx === null){ startRadio(); return; }
  if(!SONGS[currentIdx].audio) return;
  if(audioEl.paused){ audioEl.play().catch(()=>{}); setPlayIcon(true); setAmbientPlaying(true); }
  else{ audioEl.pause(); setPlayIcon(false); setAmbientPlaying(false); }
});

audioEl.addEventListener('timeupdate', () => {
  const dur = audioEl.duration;
  if(!isFinite(dur) || dur <= 0) return;
  const frac = audioEl.currentTime / dur;
  document.getElementById('scrub').value = Math.round(frac * 1000);
  document.getElementById('t-elapsed').textContent = fmtTime(audioEl.currentTime);
  document.getElementById('t-remaining').textContent = '-' + fmtTime(dur - audioEl.currentTime);
});
document.getElementById('scrub').addEventListener('input', (e) => {
  const dur = audioEl.duration;
  if(!isFinite(dur) || dur <= 0) return;
  audioEl.currentTime = (Number(e.target.value) / 1000) * dur;
});
audioEl.addEventListener('play', () => {
  setPlayIcon(true); setAmbientPlaying(true);
  if(playCounted || currentIdx === null) return;
  const s = SONGS[currentIdx];
  if(!s || !s.audio || !s.id) return;
  playCounted = true;
  incrementPlay(s.id);
});
audioEl.addEventListener('pause', () => { setPlayIcon(false); setAmbientPlaying(false); });
audioEl.addEventListener('ended', () => {
  playCounted = false;
  if(mode !== 'manual') advanceQueue();
});

async function incrementPlay(songId){
  try{ await supabaseClient.rpc('increment_play_count', { song_id: songId }); }
  catch(_){ /* best effort, never disrupt playback */ }
}

/* ============================================================
   Radio, category radio, queue navigation
   ============================================================ */
function shuffledIndices(catFilter){
  let idxs = SONGS.map((s,i)=>i).filter(i => !catFilter || SONGS[i].categories.includes(catFilter));
  for(let i=idxs.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [idxs[i],idxs[j]]=[idxs[j],idxs[i]]; }
  return idxs;
}
function advanceQueue(){
  if(queue.length === 0) return;
  queuePos = (queuePos + 1) % queue.length;
  loadSong(queue[queuePos]);
}
function startRadio(){
  if(SONGS.length === 0) return;
  mode = 'radio';
  document.getElementById('radio-btn').classList.add('active');
  queue = shuffledIndices(null); queuePos = 0;
  loadSong(queue[0]);
}
document.getElementById('radio-btn').addEventListener('click', startRadio);
document.getElementById('cat-radio-select').addEventListener('change', (e) => {
  const cat = e.target.value;
  if(!cat) return;
  mode = 'catRadio';
  document.getElementById('radio-btn').classList.remove('active');
  queue = shuffledIndices(cat); queuePos = 0;
  if(queue.length) loadSong(queue[0]);
});
document.getElementById('prev-btn').addEventListener('click', () => {
  if(mode !== 'manual' && queue.length){
    queuePos = (queuePos - 1 + queue.length) % queue.length;
    loadSong(queue[queuePos]);
  } else if(currentIdx !== null){
    loadSong((currentIdx - 1 + SONGS.length) % SONGS.length);
  }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if(mode !== 'manual' && queue.length) advanceQueue();
  else if(currentIdx !== null) loadSong((currentIdx + 1) % SONGS.length);
});

/* ============================================================
   Search + tabs
   ============================================================ */
document.getElementById('search').addEventListener('input', (e) => { searchTerm = e.target.value; renderList(); });

const tabSongs = document.getElementById('tab-songs');
const tabPlaylists = document.getElementById('tab-playlists');
function switchTab(which){
  const songs = which === 'songs';
  tabSongs.classList.toggle('active', songs);
  tabPlaylists.classList.toggle('active', !songs);
  document.getElementById('songs-panel').classList.toggle('hidden', !songs);
  document.getElementById('playlists-panel').classList.toggle('hidden', songs);
  if(!songs) renderPlaylists();
}
tabSongs.addEventListener('click', () => switchTab('songs'));
tabPlaylists.addEventListener('click', () => switchTab('playlists'));

/* ============================================================
   Local playlists (saved in the browser)
   ============================================================ */
const PL_KEY = 'laivy-playlists-v1';
let playlists = loadPlaylists();

function loadPlaylists(){
  try{ return JSON.parse(localStorage.getItem(PL_KEY)) || []; }catch(e){ return []; }
}
function savePlaylists(){
  try{ localStorage.setItem(PL_KEY, JSON.stringify(playlists)); }catch(e){}
}
function newId(){ return 'pl_' + hashStr(String(playlists.length) + '|' + (playlists.map(p=>p.id).join(','))) + '_' + playlists.length; }

function createPlaylist(name){
  name = (name || '').trim();
  if(!name) return null;
  const pl = { id: newId(), name, songIds: [] };
  playlists.push(pl); savePlaylists();
  return pl;
}
document.getElementById('pl-add').addEventListener('click', () => {
  const input = document.getElementById('pl-name');
  if(createPlaylist(input.value)){ input.value = ''; renderPlaylists(); }
});
document.getElementById('pl-name').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('pl-add').click(); }
});

function songById(id){ return SONGS.find(s => s.id === id); }

function renderPlaylists(){
  const body = document.getElementById('playlists-body');
  if(playlists.length === 0){
    body.innerHTML = `<div class="muted">No playlists yet. Create one above, then open it to add songs.</div>`;
    return;
  }
  body.innerHTML = playlists.map(pl => {
    const songsHtml = pl.songIds.map(id => {
      const s = songById(id);
      if(!s) return '';
      const heb = isHebrew(s);
      const label = heb ? s.title : (s.title || s.title_translit);
      return `<div class="pl-song">
        <span class="t ${heb?'':'en'}">${escHtml(label)}</span>
        <button class="x" data-pl="${pl.id}" data-id="${escHtml(id)}" title="Remove">&times;</button>
      </div>`;
    }).join('');
    return `<div class="pl-card">
      <div class="pl-card-head">
        <span class="pl-name">${escHtml(pl.name)}</span>
        <span class="pl-count">${pl.songIds.length}</span>
        <button class="pl-mini primary" data-act="add" data-pl="${pl.id}">Add songs</button>
        <button class="pl-mini" data-act="play" data-pl="${pl.id}">Play</button>
        <button class="pl-mini" data-act="rename" data-pl="${pl.id}">Rename</button>
        <button class="pl-mini danger" data-act="delete" data-pl="${pl.id}">Delete</button>
      </div>
      <div class="pl-songs">${songsHtml || `<button class="pl-mini primary" data-act="add" data-pl="${pl.id}">+ Add songs</button>`}</div>
    </div>`;
  }).join('');

  body.querySelectorAll('.pl-mini').forEach(btn => {
    btn.addEventListener('click', () => {
      const pl = playlists.find(p => p.id === btn.dataset.pl);
      if(!pl) return;
      if(btn.dataset.act === 'add') openPicker(pl.id);
      else if(btn.dataset.act === 'play') playPlaylist(pl);
      else if(btn.dataset.act === 'rename'){
        const name = (window.prompt('Rename playlist', pl.name) || '').trim();
        if(name){ pl.name = name; savePlaylists(); renderPlaylists(); }
      } else if(btn.dataset.act === 'delete'){
        if(confirm(`Delete playlist "${pl.name}"?`)){
          playlists = playlists.filter(p => p.id !== pl.id); savePlaylists(); renderPlaylists();
        }
      }
    });
  });
  body.querySelectorAll('.pl-song .x').forEach(btn => {
    btn.addEventListener('click', () => {
      const pl = playlists.find(p => p.id === btn.dataset.pl);
      if(!pl) return;
      pl.songIds = pl.songIds.filter(id => id !== btn.dataset.id);
      savePlaylists(); renderPlaylists();
    });
  });
}

function playPlaylist(pl){
  const idxs = pl.songIds.map(id => SONGS.findIndex(s => s.id === id)).filter(i => i >= 0);
  if(idxs.length === 0){ alert('This playlist has no available songs yet.'); return; }
  mode = 'playlist';
  document.getElementById('radio-btn').classList.remove('active');
  queue = idxs; queuePos = 0;
  switchTab('songs');
  loadSong(queue[0]);
}

/* add-to-playlist popover */
let openMenuEl = null;
function closeAddMenu(){ if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; document.removeEventListener('click', closeAddMenu); } }
function openAddMenu(anchor, idx){
  closeAddMenu();
  const song = SONGS[idx];
  const menu = document.createElement('div');
  menu.className = 'add-menu';
  const items = playlists.map(pl =>
    `<button data-pl="${pl.id}">${escHtml(pl.name)} <span class="pl-count">${pl.songIds.includes(song.id)?'✓':''}</span></button>`
  ).join('');
  menu.innerHTML = (items || '') + (items ? `<div class="sep"></div>` : '') + `<button class="new" data-new="1">+ New playlist</button>`;
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.top = (window.scrollY + r.bottom + 6) + 'px';
  menu.style.left = Math.max(8, Math.min(window.scrollX + r.right - menu.offsetWidth, window.scrollX + window.innerWidth - menu.offsetWidth - 8)) + 'px';
  openMenuEl = menu;

  menu.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      if(b.dataset.new){
        const name = (window.prompt('New playlist name') || '').trim();
        if(!name){ closeAddMenu(); return; }
        const pl = createPlaylist(name);
        pl.songIds.push(song.id); savePlaylists();
      } else {
        const pl = playlists.find(p => p.id === b.dataset.pl);
        if(pl && !pl.songIds.includes(song.id)){ pl.songIds.push(song.id); savePlaylists(); }
      }
      anchor.classList.add('added');
      closeAddMenu();
      if(!document.getElementById('playlists-panel').classList.contains('hidden')) renderPlaylists();
    });
  });
  setTimeout(() => document.addEventListener('click', closeAddMenu), 0);
}

/* ============================================================
   Playlist-first song picker (primary add flow)
   ============================================================ */
let pickerFor = null, pickerSearch = '';
const pickerOverlay = document.getElementById('picker-overlay');

function openPicker(plId){
  const pl = playlists.find(p => p.id === plId);
  if(!pl) return;
  pickerFor = plId; pickerSearch = '';
  document.getElementById('picker-plname').textContent = pl.name;
  const si = document.getElementById('picker-search');
  si.value = '';
  pickerOverlay.classList.remove('hidden');
  renderPickerList();
  si.focus();
}
function closePicker(){
  pickerOverlay.classList.add('hidden');
  pickerFor = null;
  renderPlaylists();
}
function updatePickerCount(){
  const pl = playlists.find(p => p.id === pickerFor);
  if(!pl) return;
  const c = pl.songIds.length;
  document.getElementById('picker-count').textContent = c + (c === 1 ? ' song in playlist' : ' songs in playlist');
}
function renderPickerList(){
  const pl = playlists.find(p => p.id === pickerFor);
  if(!pl) return;
  const term = pickerSearch.trim().toLowerCase();
  const list = document.getElementById('picker-list');
  const matches = SONGS.filter(s => !term ||
    (s.title_translit + ' ' + s.title + ' ' + s.categories.join(' ')).toLowerCase().includes(term));
  list.innerHTML = matches.map(s => {
    const heb = isHebrew(s);
    const label = heb ? s.title : (s.title || s.title_translit);
    const added = pl.songIds.includes(s.id);
    return `<div class="pick ${added?'added':''}" data-id="${escHtml(s.id)}">
      <span class="pick-check">${added ? '✓' : '+'}</span>
      <span class="pick-title ${heb?'':'en'}">${escHtml(label)}</span>
    </div>`;
  }).join('') || `<div class="muted">No songs match.</div>`;
  updatePickerCount();
  list.querySelectorAll('.pick').forEach(el => {
    el.addEventListener('click', () => togglePick(el.dataset.id, el));
  });
}
function togglePick(songId, el){
  const pl = playlists.find(p => p.id === pickerFor);
  if(!pl) return;
  const i = pl.songIds.indexOf(songId);
  if(i >= 0){ pl.songIds.splice(i, 1); el.classList.remove('added'); el.querySelector('.pick-check').textContent = '+'; }
  else { pl.songIds.push(songId); el.classList.add('added'); el.querySelector('.pick-check').textContent = '✓'; }
  savePlaylists();
  updatePickerCount();
}
pickerOverlay.addEventListener('click', (e) => { if(e.target === pickerOverlay) closePicker(); });
document.getElementById('picker-close').addEventListener('click', closePicker);
document.getElementById('picker-done').addEventListener('click', closePicker);
document.getElementById('picker-search').addEventListener('input', (e) => { pickerSearch = e.target.value; renderPickerList(); });

/* ============================================================
   Init
   ============================================================ */
loadSongs();
</script>
</body>
