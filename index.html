<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laivy Hart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Righteous&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FBF3E7;
    --cream-2: #F3E7D3;
    --charcoal: #241F1C;
    --charcoal-dim: #6E655C;
    --coral: #E8543E;
    --coral-dim: #C7402C;
    --turquoise: #2A9D8F;
    --mustard: #E8A93A;
    --chrome: #D8D2C6;
    --line: rgba(36,31,28,0.12);
    --line-strong: rgba(36,31,28,0.26);
    --display: 'Righteous', cursive;
    --heb: 'Frank Ruhl Libre', serif;
    --body: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--charcoal);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  /* ---------- Top nav ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem 5vw;
    border-bottom:3px solid var(--charcoal);
    flex-wrap:wrap;
    gap:0.8rem;
  }
  .wordmark{
    font-family:var(--display);
    font-size:1.7rem;
    letter-spacing:0.01em;
    color:var(--charcoal);
  }
  .wordmark .hl-ai{color:var(--coral);}
  .wordmark .hl-art{color:var(--turquoise);}
  .tagline{
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--charcoal-dim);
    letter-spacing:0.03em;
  }

  /* ---------- Jukebox ---------- */
  .jukebox-wrap{
    padding:2rem 5vw 1.4rem;
  }
  .jukebox{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:0;
    border:3px solid var(--charcoal);
    border-radius:18px;
    overflow:hidden;
    background:#fff;
  }
  @media (max-width:860px){
    .jukebox{grid-template-columns:1fr;}
  }

  /* left machine panel */
  .machine{
    background:linear-gradient(180deg, var(--coral), var(--coral-dim));
    padding:1.4rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#fff;
    position:relative;
  }
  .dome{
    width:100%;
    aspect-ratio:1/0.85;
    background:var(--charcoal);
    border-radius:14px;
    border:4px solid var(--mustard);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:1rem;
  }
  .dome svg{width:90%;height:60%;}
  .machine-grille{
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:4px;
    width:100%;
    padding:0.6rem 0.2rem;
    margin-bottom:1rem;
  }
  .machine-grille span{
    background:rgba(0,0,0,0.18);
    border-radius:50%;
    aspect-ratio:1;
  }
  .transport{
    display:flex;
    gap:0.5rem;
    margin-bottom:0.9rem;
  }
  .tbtn{
    width:2.6rem; height:2.6rem;
    border-radius:50%;
    border:2px solid var(--charcoal);
    background:var(--cream);
    color:var(--charcoal);
    cursor:pointer;
    font-size:1rem;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .tbtn.big{width:3.1rem;height:3.1rem;background:var(--mustard); font-size:1.15rem;}
  .tbtn:hover{transform:translateY(-1px);}
  .mode-row{
    display:flex;
    gap:0.5rem;
    flex-wrap:wrap;
    justify-content:center;
  }
  .mode-btn{
    font-family:var(--mono);
    font-size:0.66rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:0.4rem 0.65rem;
    border-radius:20px;
    border:2px solid var(--charcoal);
    background:#fff;
    color:var(--charcoal);
    cursor:pointer;
  }
  .mode-btn.active{background:var(--turquoise); color:#fff; border-color:var(--turquoise);}
  .cat-select{
    margin-top:0.6rem;
    width:100%;
    font-family:var(--mono);
    font-size:0.7rem;
    padding:0.4rem;
    border-radius:8px;
    border:2px solid var(--charcoal);
    background:#fff;
    color:var(--charcoal);
  }

  /* right info panel */
  .now-panel{
    padding:1.6rem 1.8rem;
    display:flex;
    flex-direction:column;
    min-height:380px;
  }
  .now-empty{
    margin:auto;
    text-align:center;
    color:var(--charcoal-dim);
    font-family:var(--mono);
    font-size:0.85rem;
  }
  .now-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:1rem;
    flex-wrap:wrap;
  }
  .now-title-he{font-family:var(--heb); direction:rtl; font-size:1.7rem; font-weight:700;}
  .now-title-translit{font-family:var(--mono); font-size:0.8rem; color:var(--charcoal-dim); margin-top:0.1rem;}
  .pills{display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.7rem;}
  .pill{
    font-family:var(--mono);
    font-size:0.64rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:0.28rem 0.6rem;
    border-radius:20px;
    border:1.5px solid var(--line-strong);
    color:var(--charcoal-dim);
  }
  .pill.cat{background:var(--cream-2); border-color:transparent; color:var(--charcoal);}
  .pill.lang{background:var(--turquoise); color:#fff; border-color:transparent;}
  .pill.len{background:var(--mustard); color:var(--charcoal); border-color:transparent;}

  .lang-toggle{display:flex; gap:0.4rem; margin-top:1rem;}
  .lang-toggle button{
    font-family:var(--mono); font-size:0.68rem; letter-spacing:0.05em; text-transform:uppercase;
    padding:0.35rem 0.7rem; border:1.5px solid var(--line-strong); background:transparent;
    color:var(--charcoal-dim); border-radius:20px; cursor:pointer;
  }
  .lang-toggle button.active{background:var(--charcoal); color:#fff; border-color:var(--charcoal);}

  .about-box{
    margin-top:1.1rem;
    padding:0.9rem 1rem;
    background:var(--cream-2);
    border-radius:10px;
    font-size:0.92rem;
    line-height:1.55;
    color:var(--charcoal);
  }
  .about-box .lbl{
    font-family:var(--mono); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--coral-dim); display:block; margin-bottom:0.3rem;
  }

  .lyrics-panel{
    margin-top:1.1rem;
    max-height:340px;
    overflow-y:auto;
    padding-right:0.4rem;
  }
  .lyrics{
    font-size:1rem;
    line-height:1.85;
    white-space:pre-line;
  }
  .lyrics.heb{direction:rtl; font-family:var(--heb); font-size:1.15rem; text-align:right;}
  .lyrics.hidden{display:none;}

  /* ---------- Browse list ---------- */
  main{padding:0.5rem 5vw 8rem;}
  .list-controls{
    display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center;
    padding:1rem 0; border-bottom:2px solid var(--charcoal);
    position:sticky; top:0; background:rgba(251,243,231,0.94); backdrop-filter:blur(6px); z-index:15;
  }
  .search{
    flex:1 1 220px; background:#fff; border:2px solid var(--line-strong); border-radius:10px;
    padding:0.55rem 0.85rem; font-family:var(--body); font-size:0.95rem; color:var(--charcoal);
  }
  .search:focus{outline:2px solid var(--coral); outline-offset:1px;}
  .filter-pill{
    font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em;
    padding:0.42rem 0.75rem; border-radius:20px; border:1.5px solid var(--line-strong);
    background:transparent; color:var(--charcoal-dim); cursor:pointer;
  }
  .filter-pill:hover{border-color:var(--coral-dim); color:var(--charcoal);}
  .filter-pill.active{background:var(--charcoal); color:#fff; border-color:var(--charcoal);}

  .song-row{
    display:grid; grid-template-columns:2rem 1fr auto; gap:1rem; align-items:center;
    padding:0.85rem 0.2rem; border-bottom:1px solid var(--line); cursor:pointer; border-radius:8px;
  }
  .song-row:hover{background:#fff;}
  .song-row.playing{background:var(--cream-2);}
  .song-num{font-family:var(--mono); color:var(--charcoal-dim); font-size:0.8rem;}
  .row-title-he{font-family:var(--heb); direction:rtl; font-size:1.15rem; font-weight:500;}
  .row-title-translit{font-family:var(--mono); font-size:0.72rem; color:var(--charcoal-dim);}
  .row-pills{display:flex; gap:0.35rem; flex-wrap:wrap; justify-content:flex-end; max-width:16em;}

  .empty{text-align:center; padding:3rem 1rem; color:var(--charcoal-dim); font-family:var(--mono); font-size:0.85rem;}

  audio{display:none;}
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark">L<span class="hl-ai">AI</span>VY H<span class="hl-art">ART</span></div>
  <div class="tagline">songs · sometimes stories, sometimes prayers, always real</div>
</div>

<div class="jukebox-wrap">
  <div class="jukebox">
    <div class="machine">
      <div class="dome"><svg id="micrography" viewBox="0 0 200 40" aria-hidden="true"></svg></div>
      <div class="machine-grille" id="grille"></div>
      <div class="transport">
        <button class="tbtn" id="prev-btn" aria-label="Previous">⏮</button>

        <button class="tbtn" id="next-btn" aria-label="Next">⏭</button>
      </div>
      <div class="mode-row">
        <button class="mode-btn" id="radio-btn">📻 Radio</button>
      </div>
      <select class="cat-select" id="cat-radio-select">
        <option value="">▶ Category radio…</option>
      </select>
    </div>
    <div class="now-panel" id="now-panel">
      <div class="now-empty">Pick a song below, hit Radio, or spin a category to start listening.</div>
    </div>
  </div>
</div>

<div class="list-controls" id="list-controls-wrap">
  <input class="search" id="search" type="text" placeholder="Search a title, category, or word…" aria-label="Search songs">
</div>
<div class="list-controls" style="border-top:none; padding-top:0;" id="cat-pills"></div>

<main id="main"></main>

<audio id="audio-el"></audio>

Behold, a people that rises like a lion, lifts itself like a lion.

  lyrics_en:`Not every truth needs a voice.

some silence comes to heal.

saves a world without ever announcing it.

on a heart that burned inside and chose not to scream.
A word could have broken it, silence could have built it,
and a light created in secret shines between the silences.

how many times did I know I was right first.
I had something to fire back, I had a way to win,
but the body found its healing when the mouth learned to rest.

let me be a hero where no one is watching.

Because there's a light you can't see with eyes made of dust,
and there's a reward for a single moment no creature could estimate.

the silence rises up and returns light to the soul.

  lyrics_en:`When we were still small and every step was new,
you clapped your hands like we'd conquered the whole world.
Every word we said, every drawing on the table,
became a treasure to you, a memory that never faded.

You saw in us what we didn't yet know how to see in ourselves.
You believed in us before we even knew what we'd become.

Grandchildren are the crown of the old, and parents are the glory of children.
We were your crown — and you are our glory, forever.

When we grew up we got busy, and the days moved fast.
We didn't always stop to ask where it all began,
who carried the names, who kept the story,
who quietly passed the melody down from generation to generation.

Today we're looking back and finally starting to see
how much strength was on that road, how much light between the tears.

Grandchildren are the crown of the old, and parents are the glory of children.
We were your crown — and you are our glory, forever.

Remember the days of old, understand the years of generation after generation.
Ask your father and he will tell you, your elders, and they will say to you.

There's a story in every wrinkle, a prayer in every glance.
There's a whole world that slowly made its way down to us.
And if you once stood and clapped for us,
today we stand and clap for you twice as loud.

Grandchildren are the crown of the old, and parents are the glory of children.
We were your crown — and you are our glory, forever.

You are the root and we are the branches.
You are the story we get to continue.
And everything beautiful in us started inside you.

/* ---------------------------------------------------------
  State + rendering
--------------------------------------------------------- */
const mainEl = document.getElementById('main');
const catPillsEl = document.getElementById('cat-pills');
const searchEl = document.getElementById('search');
const catRadioSelect = document.getElementById('cat-radio-select');
let activeCat = 'all';
let searchTerm = '';
let currentIdx = null;
let currentLangView = 'he';
let mode = 'manual'; // manual | radio | catRadio
let radioQueue = [];
let radioPos = 0;
let idleTimer = null;

function allCategories(){
  const set = new Set();
  SONGS.forEach(s => s.categories.forEach(c => set.add(c)));
  return Array.from(set);
}

function renderCatPills(){
  let html = `<button class="filter-pill ${activeCat==='all'?'active':''}" data-cat="all">All songs</button>`;
  allCategories().forEach(c => {
    html += `<button class="filter-pill ${activeCat===c?'active':''}" data-cat="${c}">${c}</button>`;
  });
  catPillsEl.innerHTML = html;
  catPillsEl.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => { activeCat = btn.dataset.cat; renderList(); });
  });

  catRadioSelect.innerHTML = `<option value="">▶ Category radio…</option>` +
    allCategories().map(c => `<option value="${c}">${c}</option>`).join('');
}

function songMatches(s){
  const inCat = activeCat === 'all' || s.categories.includes(activeCat);
  if(!inCat) return false;
  const term = searchTerm.trim().toLowerCase();
  if(!term) return true;
  const hay = (s.title_translit + ' ' + s.title_he + ' ' + s.categories.join(' ') + ' ' + s.about).toLowerCase();
  return hay.includes(term);
}

function renderList(){
  const filtered = SONGS.map((s,i)=>({...s, idx:i})).filter(songMatches);
  if(filtered.length === 0){
    mainEl.innerHTML = `<div class="empty">Nothing matches. Try a different word or clear the filter.</div>`;
    return;
  }
  let html = '';
  filtered.forEach(s => {
    const isPlaying = currentIdx === s.idx;
    html += `
      <div class="song-row ${isPlaying?'playing':''}" tabindex="0" data-idx="${s.idx}" role="button">
        <span class="song-num">${String(s.idx+1).padStart(2,'0')}</span>
        <span>
          <div class="row-title-he">${s.title_he}</div>
          <div class="row-title-translit">${s.title_translit}</div>
        </span>
        <span class="row-pills">
          ${s.categories.map(c=>`<span class="pill cat">${c}</span>`).join('')}
          <span class="pill lang">${s.language}</span>
          <span class="pill len">${s.length}</span>
        </span>
      </div>`;
  });
  mainEl.innerHTML = html;
  mainEl.querySelectorAll('.song-row').forEach(row => {
    const idx = Number(row.dataset.idx);
    row.addEventListener('click', () => { mode = 'manual'; loadSong(idx); });
  });
}

const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const radioBtn = document.getElementById('radio-btn');
const micro = document.getElementById('micrography');
const grille = document.getElementById('grille');
let animId = null;
let t = 0;

// build speaker grille dots once
(function initGrille(){
  let html = '';
  for(let i=0;i<24;i++) html += '<span></span>';
  grille.innerHTML = html;
})();

function loadSong(idx){
  currentIdx = idx;
  currentLangView = 'he';
  renderNowPanel();
  renderList();
  playCurrent();
  document.querySelector('.jukebox-wrap').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderNowPanel(){
  if(currentIdx === null){
    nowPanel.innerHTML = `<div class="now-empty">Pick a song below, hit Radio, or spin a category to start listening.</div>`;
    return;
  }
  const s = SONGS[currentIdx];
  nowPanel.innerHTML = `
    <div class="now-head">
      <div>
        <div class="now-title-he">${s.title_he}</div>
        <div class="now-title-translit">${s.title_translit}</div>
        <div class="pills">
          ${s.categories.map(c=>`<span class="pill cat">${c}</span>`).join('')}
          <span class="pill lang">${s.language}</span>
          <span class="pill len">${s.length}</span>
        </div>
      </div>
      <div class="lang-toggle">
        <button data-lang="he" class="${currentLangView==='he'?'active':''}">עברית</button>
        <button data-lang="en" class="${currentLangView==='en'?'active':''}">EN</button>
      </div>
    </div>
    <div class="about-box"><span class="lbl">About this song</span>${s.about}</div>
    <div class="lyrics-panel">
      <div class="lyrics heb ${currentLangView==='he'?'':'hidden'}">${s.lyrics_he}</div>
      <div class="lyrics ${currentLangView==='en'?'':'hidden'}">${s.lyrics_en}</div>
    </div>
  `;
  nowPanel.querySelectorAll('.lang-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLangView = btn.dataset.lang;
      renderNowPanel();
    });
  });
}

function playCurrent(){
  if(currentIdx === null) return;
  const s = SONGS[currentIdx];
  buildMicrography(s.title_he.replace(/\s+/g,''));
  clearTimeout(idleTimer);
  if(s.audio){
    audioEl.src = s.audio;
    audioEl.play().catch(()=>{});
    playBtn.textContent = '❚❚';
    startWave();
  } else {
    audioEl.pause();
    playBtn.textContent = '▶';
    startWave(true);
    if(mode !== 'manual'){
      // demo pacing until real audio is hooked up
      idleTimer = setTimeout(advanceQueue, 12000);
    }
  }
}

playBtn.addEventListener('click', () => {
  if(currentIdx === null) return;
  if(audioEl.paused){
    if(SONGS[currentIdx].audio) audioEl.play().catch(()=>{});
    playBtn.textContent = '❚❚';
    startWave();
  } else {
    audioEl.pause();
    playBtn.textContent = '▶';
    cancelAnimationFrame(animId);
    clearTimeout(idleTimer);
  }
});

audioEl.addEventListener('ended', () => {
  if(mode !== 'manual') advanceQueue();
});

function shuffledIndices(catFilter){
  let idxs = SONGS.map((s,i)=>i).filter(i => !catFilter || SONGS[i].categories.includes(catFilter));
  for(let i=idxs.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i],idxs[j]]=[idxs[j],idxs[i]];
  }
  return idxs;
}

function advanceQueue(){
  if(radioQueue.length === 0) return;
  radioPos = (radioPos+1) % radioQueue.length;
  loadSong(radioQueue[radioPos]);
}

radioBtn.addEventListener('click', () => {
  mode = 'radio';
  radioQueue = shuffledIndices(null);
  radioPos = 0;
  radioBtn.classList.add('active');
  loadSong(radioQueue[0]);
});

catRadioSelect.addEventListener('change', (e) => {
  const cat = e.target.value;
  if(!cat) return;
  mode = 'catRadio';
  radioBtn.classList.remove('active');
  radioQueue = shuffledIndices(cat);
  radioPos = 0;
  if(radioQueue.length) loadSong(radioQueue[0]);
});

prevBtn.addEventListener('click', () => {
  if(mode !== 'manual' && radioQueue.length){
    radioPos = (radioPos-1+radioQueue.length) % radioQueue.length;
    loadSong(radioQueue[radioPos]);
  } else if(currentIdx !== null){
    loadSong((currentIdx-1+SONGS.length) % SONGS.length);
  }
});
nextBtn.addEventListener('click', () => {
  if(mode !== 'manual' && radioQueue.length){
    advanceQueue();
  } else if(currentIdx !== null){
    loadSong((currentIdx+1) % SONGS.length);
  }
});

function buildMicrography(chars){
  const list = chars.split('');
  let svg = '';
  for(let i=0;i<20;i++){
    const ch = list[i % list.length];
    const color = WAVE_COLORS[i % WAVE_COLORS.length];
    svg += `<text data-i="${i}" x="${i*10+5}" y="21" font-size="13" text-anchor="middle" fill="${color}">${ch}</text>`;
  }
  micro.innerHTML = svg;
}

function startWave(idle){
  cancelAnimationFrame(animId);
  const texts = micro.querySelectorAll('text');
  function frame(){
    t += idle ? 0.03 : 0.09;
    texts.forEach((el, i) => {
      const amp = idle ? 4 : 12;
      const y = 21 + Math.sin(t + i*0.5) * amp * 0.4;
      const scale = 1 + Math.sin(t*1.3 + i*0.4) * (idle ? 0.05 : 0.18);
      el.setAttribute('y', y.toFixed(1));
      el.setAttribute('transform', `scale(${scale.toFixed(2)})`);
      el.setAttribute('transform-origin', `${(i*10+5)} 21`);
    });
    animId = requestAnimationFrame(frame);
  }
  frame();
}

searchEl.addEventListener('input', (e) => { searchTerm = e.target.value; renderList(); });

renderCatPills();
renderList();
renderNowPanel();
</script>
</body>
</html>
