<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laivy Hart · Admin</title>
<script>
  (function(){try{var t=localStorage.getItem('laivy-theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  /* Old variable names remapped to shared theme tokens so any inline
     references still resolve, on top of the fresh admin stylesheet below. */
  :root{
    --cream:var(--bg); --cream-2:var(--bg-2);
    --charcoal:var(--text); --charcoal-dim:var(--text-dim);
    --coral:var(--accent-2); --coral-dim:var(--accent-1);
    --turquoise:var(--accent-2); --mustard:var(--accent-2);
    --line-strong:var(--chip-border);
    --display:var(--font-display); --heb:var(--font-heb); --body:var(--font-ui); --mono:var(--font-ui);
  }
  body{background:var(--bg); color:var(--text); font-family:var(--font-ui); min-height:100vh;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:1rem 5vw; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:0.8rem;
  }
  .topbar-left{display:flex; align-items:baseline; gap:0.7rem;}
  .admin-tag{font-family:var(--font-ui); font-size:0.66rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint);}
  .topbar-right{display:flex; align-items:center; gap:0.8rem;}
  .logout-btn{
    font-family:var(--font-ui); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em;
    padding:0.45rem 0.85rem; border-radius:16px; border:1px solid var(--chip-border);
    background:var(--chip-bg); color:var(--text-dim); cursor:pointer;
  }
  .logout-btn:hover{border-color:var(--accent-2); color:var(--text);}

  /* Login */
  .login-wrap{
    max-width:420px; margin:12vh auto; padding:2rem;
    background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius);
    backdrop-filter:blur(22px) saturate(1.2); -webkit-backdrop-filter:blur(22px) saturate(1.2); text-align:center;
  }
  .login-wrap h1{font-family:var(--font-display); font-weight:600; font-size:1.6rem; margin:0 0 0.4rem;}
  .login-wrap p{color:var(--text-dim); font-size:0.92rem; margin-bottom:1.4rem;}
  .login-wrap input{
    width:100%; padding:0.7rem 0.9rem; border:1px solid var(--chip-border); border-radius:10px;
    font-family:var(--font-ui); font-size:1rem; margin-bottom:0.8rem; background:var(--chip-bg); color:var(--text);
  }
  .login-wrap input:focus{outline:none; border-color:var(--accent-2);}
  .login-wrap button{
    width:100%; padding:0.75rem; border-radius:10px; border:none;
    background:var(--accent-grad); color:#fff; font-family:var(--font-ui); font-size:0.8rem;
    text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .login-wrap button:hover{filter:brightness(1.08);}
  .login-status{margin-top:1rem; font-family:var(--font-ui); font-size:0.78rem; color:var(--accent-2);}

  /* Layout */
  .admin-layout{display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 62px);}
  @media (max-width:860px){ .admin-layout{grid-template-columns:1fr;} }

  .song-list{border-right:1px solid var(--line); padding:1.2rem; overflow-y:auto;}
  .new-song-btn{
    width:100%; padding:0.7rem; margin-bottom:1rem; border-radius:12px; border:none;
    background:var(--accent-grad); color:#fff; font-family:var(--font-ui); font-size:0.75rem;
    text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .new-song-btn:hover{filter:brightness(1.08);}
  .list-item{padding:0.7rem 0.6rem; border-bottom:1px solid var(--line); cursor:pointer; border-radius:10px;}
  .list-item:hover{background:var(--glass-hi);}
  .list-item.active{background:var(--glass-hi); border-left:3px solid var(--accent-2);}
  .list-item .lt-he{font-family:var(--font-heb); direction:rtl; font-size:1.05rem;}
  .list-item .lt-translit{font-family:var(--font-display); font-style:italic; font-size:0.75rem; color:var(--text-dim);}
  .list-item .lt-audio{font-size:0.64rem; margin-top:0.2rem; font-family:var(--font-ui);}
  .lt-audio.has{color:var(--accent-2);} .lt-audio.missing{color:var(--text-faint);}
  .list-item .lt-plays{font-family:var(--font-ui); font-size:0.62rem; color:var(--text-faint); margin-top:0.15rem;}

  .form-area{padding:2rem 3vw; overflow-y:auto;}
  .form-area h2{font-family:var(--font-display); font-weight:600; font-size:1.4rem; margin-top:0;}
  .field{margin-bottom:1.1rem;}
  .field label{
    display:block; font-family:var(--font-ui); font-size:0.64rem; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--text-faint); margin-bottom:0.4rem;
  }
  .field input[type=text], .field select, .field textarea{
    width:100%; padding:0.6rem 0.8rem; border:1px solid var(--chip-border); border-radius:10px;
    font-family:var(--font-ui); font-size:0.95rem; background:var(--chip-bg); color:var(--text);
  }
  .field input[type=text]:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent-2);}
  .field textarea{min-height:120px; resize:vertical; font-family:var(--font-heb); font-size:1.05rem; line-height:1.7;}
  .field.two-col{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
  .cat-checks{display:flex; flex-wrap:wrap; gap:0.5rem;}
  .cat-check{
    font-family:var(--font-ui); font-size:0.7rem; padding:0.35rem 0.7rem; border-radius:16px;
    border:1px solid var(--chip-border); background:var(--chip-bg); color:var(--text-dim); cursor:pointer; user-select:none;
  }
  .cat-check.on{background:var(--accent-grad); color:#fff; border-color:transparent;}
  .add-cat-row{display:flex; gap:0.5rem; margin-top:0.5rem;}
  .add-cat-row input{flex:1; padding:0.45rem 0.6rem; border:1px solid var(--chip-border); border-radius:10px; font-family:var(--font-ui); font-size:0.85rem; background:var(--chip-bg); color:var(--text);}
  .add-cat-row input:focus{outline:none; border-color:var(--accent-2);}
  .add-cat-row button{
    font-family:var(--font-ui); font-size:0.7rem; padding:0.45rem 0.75rem; border-radius:10px;
    border:1px solid var(--chip-border); background:var(--chip-bg); color:var(--text); cursor:pointer;
  }
  .add-cat-row button:hover{border-color:var(--accent-2);}

  .audio-box{
    padding:1rem; background:var(--glass-hi); border:1px solid var(--line); border-radius:12px;
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  }
  .audio-box .status{font-family:var(--font-ui); font-size:0.75rem; color:var(--text-dim);}
  .audio-box audio{max-width:220px;}
  .cover-preview{width:52px; height:52px; border-radius:10px; background-size:cover; background-position:center; border:1px solid var(--glass-border); flex-shrink:0;}

  .save-row{display:flex; gap:0.8rem; margin-top:1.6rem; flex-wrap:wrap;}
  .save-btn{
    padding:0.8rem 1.7rem; border-radius:12px; border:none; background:var(--accent-grad);
    color:#fff; font-family:var(--font-ui); font-size:0.76rem; text-transform:uppercase;
    letter-spacing:0.05em; cursor:pointer;
  }
  .save-btn:hover{filter:brightness(1.08);}
  .delete-btn{
    padding:0.8rem 1.2rem; border-radius:12px; border:1px solid var(--accent-1); background:transparent;
    color:var(--accent-1); font-family:var(--font-ui); font-size:0.76rem; text-transform:uppercase;
    letter-spacing:0.05em; cursor:pointer;
  }
  .delete-btn:hover{background:var(--accent-1); color:#fff;}
  .save-msg{font-family:var(--font-ui); font-size:0.78rem; margin-top:0.7rem;}
  .save-msg.ok{color:var(--accent-2);} .save-msg.err{color:var(--accent-1);}
  .empty-form{color:var(--text-faint); font-family:var(--font-display); font-style:italic; font-size:1rem; padding:2rem 0;}

  /* Category manager */
  .cat-manager{margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--line);}
  .cat-manager h3{font-family:var(--font-display); font-weight:600; font-size:1.05rem; margin:0 0 0.6rem;}
  .cm-list{display:flex; flex-direction:column; gap:0.3rem; margin-bottom:0.6rem;}
  .cm-item{display:flex; align-items:center; gap:0.4rem; font-family:var(--font-ui); font-size:0.74rem;}
  .cm-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cm-count{background:var(--chip-bg); border-radius:10px; padding:0.05rem 0.45rem; color:var(--text-faint); font-size:0.66rem;}
  .cm-btn{
    font-family:var(--font-ui); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.03em;
    padding:0.24rem 0.5rem; border:1px solid var(--chip-border); background:var(--chip-bg);
    color:var(--text-dim); border-radius:8px; cursor:pointer;
  }
  .cm-btn:hover{border-color:var(--accent-2); color:var(--text);}
  .cm-btn.danger:hover{border-color:var(--accent-1); color:var(--accent-1);}
  .cm-empty{font-family:var(--font-ui); font-size:0.72rem; color:var(--text-faint);}
  .cm-msg{font-family:var(--font-ui); font-size:0.7rem; margin-top:0.35rem; min-height:1em;}
  .cm-msg.ok{color:var(--accent-2);} .cm-msg.err{color:var(--accent-1);}
</style>
</head>
<body>

<!-- ====================================================
  CONFIG: lives in config.js (loaded above), single source of truth
==================================================== -->
<script>
  const SUPABASE_URL = window.LAIVY_CONFIG.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.LAIVY_CONFIG.SUPABASE_ANON_KEY;
</script>

<div class="topbar">
  <div class="topbar-left">
    <div class="wordmark"><span class="brand-dot"></span>Laivy Hart</div>
    <div class="admin-tag">admin</div>
  </div>
  <div class="topbar-right">
    <a class="quiet-link" href="index.html">Jukebox</a>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle light and dark">◐</button>
    <button class="logout-btn" id="logout-btn" style="display:none;">Log out</button>
  </div>
</div>

<div id="login-view" class="login-wrap">
  <h1>Admin login</h1>
  <p>Enter your email and password.</p>
  <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email">
  <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
  <button id="send-link-btn">Log in</button>
  <div class="login-status" id="login-status"></div>
</div>

<div id="admin-view" class="admin-layout" style="display:none;">
  <div class="song-list">
    <button class="new-song-btn" id="new-song-btn">+ New song</button>
    <div id="list-items"></div>

    <div class="cat-manager">
      <h3>Categories</h3>
      <div id="cat-manager-list" class="cm-list"></div>
      <div class="add-cat-row">
        <input type="text" id="new-global-cat" placeholder="New category…">
        <button type="button" id="add-global-cat">Add</button>
      </div>
      <div class="cm-msg" id="cat-manager-msg"></div>
    </div>
  </div>
  <div class="form-area" id="form-area">
    <div class="empty-form">Pick a song on the left to edit, or start a new one.</div>
  </div>
</div>

<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Category vocabulary, loaded live from the `categories` table.
let categories = []; // array of { id, name, sort_order }

let songs = [];
let currentSong = null; // null = nothing loaded, {} = new, {...} = existing row
let pendingAudioFile = null;
let pendingCoverFile = null;

document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('laivy-theme', next); }catch(e){}
});

/* ---------------------------------------------------------
  Auth
--------------------------------------------------------- */
const loginView = document.getElementById('login-view');
const adminView = document.getElementById('admin-view');
const logoutBtn = document.getElementById('logout-btn');
const loginStatus = document.getElementById('login-status');

document.getElementById('send-link-btn').addEventListener('click', async () => {
  const email = document.getElementById('email-input').value.trim();
  const password = document.getElementById('password-input').value;
  if(!email || !password){ loginStatus.textContent = 'Enter both email and password.'; return; }
  loginStatus.textContent = 'Logging in...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    loginStatus.textContent = 'Error: ' + error.message;
  } else {
    loginStatus.textContent = '';
    checkSession();
  }
});

logoutBtn.addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  window.location.reload();
});

async function checkSession(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){
    loginView.style.display = 'none';
    adminView.style.display = 'grid';
    logoutBtn.style.display = 'inline-block';
    await loadSongs();
    await loadCategories();
    renderCategoryManager();
  } else {
    loginView.style.display = 'block';
    adminView.style.display = 'none';
    logoutBtn.style.display = 'none';
  }
}

supabaseClient.auth.onAuthStateChange(() => checkSession());
checkSession();

/* ---------------------------------------------------------
  Load + render song list
--------------------------------------------------------- */
async function loadSongs(){
  const { data, error } = await supabaseClient.from('songs').select('*').order('title');
  if(error){ console.error(error); return; }
  songs = data;
  renderList();
}

/* ---------------------------------------------------------
  Categories (managed vocabulary, backed by the categories table)
  Songs still store category *names* in their text[] column, so
  rename/delete go through DB functions that also rewrite the song
  arrays; we mirror that change in the local cache to keep the open
  form's edits intact without a full reload.
--------------------------------------------------------- */
async function loadCategories(){
  const { data, error } = await supabaseClient
    .from('categories').select('*').order('sort_order').order('name');
  if(error){ console.error(error); return; }
  categories = data || [];
}

function catCount(name){
  return songs.reduce((n, s) => n + ((s.categories || []).includes(name) ? 1 : 0), 0);
}

function renderCategoryManager(){
  const list = document.getElementById('cat-manager-list');
  if(!list) return;
  if(categories.length === 0){
    list.innerHTML = `<div class="cm-empty">No categories yet. Add one below.</div>`;
    return;
  }
  list.innerHTML = categories.map(c => {
    const n = catCount(c.name);
    return `<div class="cm-item">
      <span class="cm-name" title="${escAttr(c.name)}">${escHtml(c.name)}</span>
      <span class="cm-count" title="songs using this">${n}</span>
      <button type="button" class="cm-btn" data-act="rename" data-name="${escAttr(c.name)}">rename</button>
      <button type="button" class="cm-btn danger" data-act="delete" data-name="${escAttr(c.name)}">delete</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.cm-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.name;
      if(btn.dataset.act === 'rename') renameCategory(name);
      else deleteCategory(name);
    });
  });
}

function catMsg(text, kind){
  const el = document.getElementById('cat-manager-msg');
  if(!el) return;
  el.textContent = text || '';
  el.className = 'cm-msg' + (kind ? ' ' + kind : '');
}

// Capture in-progress form edits into currentSong so a re-render (after a
// category change) doesn't discard unsaved typing.
function syncFormToCurrent(){
  if(!currentSong) return;
  const g = id => document.getElementById(id);
  if(!g('f-title')) return; // form not currently on screen
  currentSong.title = g('f-title').value;
  currentSong.title_translit = g('f-translit').value;
  currentSong.language = g('f-language').value;
  currentSong.lyrics_original = g('f-lyrics-original').value;
  currentSong.lyrics_translation = g('f-lyrics-translation').value;
  currentSong.about = g('f-about').value;
  currentSong.categories = Array.from(document.querySelectorAll('.cat-check.on')).map(c => c.dataset.cat);
}

function applyCatRenameLocal(oldName, newName){
  const fix = arr => (arr || []).map(c => c === oldName ? newName : c);
  songs.forEach(s => { s.categories = fix(s.categories); });
  if(currentSong) currentSong.categories = fix(currentSong.categories);
}
function applyCatDeleteLocal(name){
  const strip = arr => (arr || []).filter(c => c !== name);
  songs.forEach(s => { s.categories = strip(s.categories); });
  if(currentSong) currentSong.categories = strip(currentSong.categories);
}

async function addCategory(){
  const input = document.getElementById('new-global-cat');
  const name = (input.value || '').trim();
  if(!name){ catMsg('Type a category name first.', 'err'); return; }
  if(categories.some(c => c.name.toLowerCase() === name.toLowerCase())){
    catMsg(`“${name}” already exists.`, 'err'); return;
  }
  const nextOrder = categories.reduce((m, c) => Math.max(m, c.sort_order || 0), 0) + 1;
  const { error } = await supabaseClient.from('categories').insert({ name, sort_order: nextOrder });
  if(error){ catMsg('Error: ' + error.message, 'err'); return; }
  input.value = '';
  syncFormToCurrent();
  await loadCategories();
  renderCategoryManager();
  if(currentSong) renderForm();
  catMsg(`Added “${name}”.`, 'ok');
}

async function renameCategory(oldName){
  const newName = (window.prompt(`Rename “${oldName}” to:`, oldName) || '').trim();
  if(!newName || newName === oldName) return;
  if(categories.some(c => c.name.toLowerCase() === newName.toLowerCase())){
    catMsg(`“${newName}” already exists.`, 'err'); return;
  }
  const { error } = await supabaseClient.rpc('rename_category', { p_old: oldName, p_new: newName });
  if(error){ catMsg('Error: ' + error.message, 'err'); return; }
  syncFormToCurrent();
  applyCatRenameLocal(oldName, newName);
  await loadCategories();
  renderCategoryManager();
  renderList();
  if(currentSong) renderForm();
  catMsg(`Renamed to “${newName}”.`, 'ok');
}

async function deleteCategory(name){
  const n = catCount(name);
  const warning = n > 0
    ? `Delete “${name}”?\n\nIt is used by ${n} song${n === 1 ? '' : 's'}. Deleting will remove this tag from ${n === 1 ? 'that song' : 'those songs'}.`
    : `Delete “${name}”?`;
  if(!confirm(warning)) return;
  const { error } = await supabaseClient.rpc('delete_category', { p_name: name });
  if(error){ catMsg('Error: ' + error.message, 'err'); return; }
  syncFormToCurrent();
  applyCatDeleteLocal(name);
  await loadCategories();
  renderCategoryManager();
  renderList();
  if(currentSong) renderForm();
  catMsg(`Deleted “${name}”.`, 'ok');
}

// Keep the vocabulary in sync if a song was tagged with a brand-new
// category via the in-form "add category" box.
async function syncNewCategories(names){
  const existing = new Set(categories.map(c => c.name));
  const toAdd = [...new Set(names.filter(n => n && !existing.has(n)))];
  if(toAdd.length === 0) return;
  let ord = categories.reduce((m, c) => Math.max(m, c.sort_order || 0), 0);
  const rows = toAdd.map(n => ({ name: n, sort_order: ++ord }));
  const { error } = await supabaseClient.from('categories').insert(rows);
  if(error) console.error('category sync failed', error);
}

document.getElementById('add-global-cat').addEventListener('click', addCategory);
document.getElementById('new-global-cat').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); addCategory(); }
});

function renderList(){
  const el = document.getElementById('list-items');
  el.innerHTML = songs.map(s => `
    <div class="list-item ${currentSong && currentSong.id===s.id ? 'active':''}" onclick="window.selectSong('${s.id}')">
      <div class="lt-he">${s.title || '(untitled)'}</div>
      <div class="lt-translit">${s.title_translit || ''}</div>
      <div class="lt-audio ${s.audio_url ? 'has':'missing'}">${s.audio_url ? '♪ audio attached' : 'no audio yet'}</div>
      <div class="lt-plays">▶ ${s.play_count ?? 0} play${(s.play_count ?? 0) === 1 ? '' : 's'}</div>
    </div>
  `).join('');
}

window.selectSong = function(id){
  const song = songs.find(s => s.id === id);
  if(!song){ console.error('Song not found for id', id); return; }
  loadIntoForm(song);
};

document.getElementById('new-song-btn').addEventListener('click', () => {
  loadIntoForm({
    title:'', title_translit:'', categories:[], language:'Hebrew',
    lyrics_original:'', lyrics_translation:'', about:'', audio_url:null
  });
});

/* ---------------------------------------------------------
  Form
--------------------------------------------------------- */
function loadIntoForm(song){
  currentSong = song;
  pendingAudioFile = null;
  pendingCoverFile = null;
  renderList();
  renderForm();
}

function renderForm(){
  const area = document.getElementById('form-area');
  if(!currentSong){
    area.innerHTML = `<div class="empty-form">Pick a song on the left to edit, or start a new one.</div>`;
    return;
  }
  const s = currentSong;
  const cats = s.categories || [];
  const chipNames = Array.from(new Set([...categories.map(c => c.name), ...cats]));

  area.innerHTML = `
    <h2>${s.id ? 'Edit song' : 'New song'}</h2>

    <div class="field two-col">
      <div>
        <label>Title</label>
        <input type="text" id="f-title" value="${escAttr(s.title)}">
      </div>
      <div>
        <label>Transliteration (optional)</label>
        <input type="text" id="f-translit" value="${escAttr(s.title_translit)}">
      </div>
    </div>

    <div class="field">
      <label>Language</label>
      <select id="f-language">
        <option value="Hebrew" ${s.language==='Hebrew'?'selected':''}>Hebrew</option>
        <option value="English" ${s.language==='English'?'selected':''}>English</option>
      </select>
    </div>

    <div class="field">
      <label>Categories</label>
      <div class="cat-checks" id="cat-checks">
        ${chipNames.map(c => `<span class="cat-check ${cats.includes(c)?'on':''}" data-cat="${escAttr(c)}">${escHtml(c)}</span>`).join('')}
      </div>
      <div class="add-cat-row">
        <input type="text" id="new-cat-input" placeholder="Add a new category...">
        <button id="add-cat-btn" type="button">Add</button>
      </div>
    </div>

    <div class="field">
      <label>Lyrics (original language)</label>
      <textarea id="f-lyrics-original">${escHtml(s.lyrics_original)}</textarea>
    </div>

    <div class="field">
      <label>English translation (leave blank if the song is already in English)</label>
      <textarea id="f-lyrics-translation" style="font-family:var(--body); direction:ltr;">${escHtml(s.lyrics_translation)}</textarea>
    </div>

    <div class="field">
      <label>About / inspiration / meaning</label>
      <textarea id="f-about" style="font-family:var(--body); direction:ltr; min-height:80px;">${escHtml(s.about)}</textarea>
    </div>

    <div class="field">
      <label>Audio</label>
      <div class="audio-box">
        <div class="status" id="audio-status">
          ${s.audio_url ? 'Audio attached ✓' : 'No audio attached yet'}
        </div>
        ${s.audio_url ? `<audio controls src="${s.audio_url}"></audio>` : ''}
        <input type="file" id="f-audio-file" accept="audio/*">
      </div>
    </div>

    <div class="field">
      <label>Cover image (optional)</label>
      <div class="audio-box">
        <div class="cover-preview" id="cover-preview" style="${s.cover_url ? `background-image:url('${s.cover_url}')` : 'background:var(--chip-bg)'}"></div>
        <div class="status" id="cover-status">
          ${s.cover_url ? 'Cover attached ✓' : 'No cover yet. Jukebox will use generative art.'}
        </div>
        <input type="file" id="f-cover-file" accept="image/*">
      </div>
    </div>

    <div class="save-row">
      <button class="save-btn" id="save-btn">Save song</button>
      ${s.id ? `<button class="delete-btn" id="delete-btn">Delete song</button>` : ''}
    </div>
    <div class="save-msg" id="save-msg"></div>
  `;

  area.querySelectorAll('.cat-check').forEach(chip => {
    chip.addEventListener('click', () => chip.classList.toggle('on'));
  });
  document.getElementById('add-cat-btn').addEventListener('click', () => {
    const input = document.getElementById('new-cat-input');
    const val = input.value.trim();
    if(!val) return;
    const chip = document.createElement('span');
    chip.className = 'cat-check on';
    chip.dataset.cat = val;
    chip.textContent = val;
    chip.addEventListener('click', () => chip.classList.toggle('on'));
    document.getElementById('cat-checks').appendChild(chip);
    input.value = '';
  });
  document.getElementById('f-audio-file').addEventListener('change', (e) => {
    pendingAudioFile = e.target.files[0] || null;
    if(pendingAudioFile){
      document.getElementById('audio-status').textContent = 'New file selected: ' + pendingAudioFile.name + ' (click Save to upload)';
    }
  });
  document.getElementById('f-cover-file').addEventListener('change', (e) => {
    pendingCoverFile = e.target.files[0] || null;
    if(pendingCoverFile){
      document.getElementById('cover-status').textContent = 'New image selected: ' + pendingCoverFile.name + ' (click Save to upload)';
      document.getElementById('cover-preview').style.backgroundImage = `url('${URL.createObjectURL(pendingCoverFile)}')`;
    }
  });
  document.getElementById('save-btn').addEventListener('click', saveSong);
  if(s.id){
    document.getElementById('delete-btn').addEventListener('click', deleteSong);
  }
}

function escHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(str){
  return (str||'').replace(/"/g,'&quot;');
}

async function saveSong(){
  const msg = document.getElementById('save-msg');
  msg.textContent = 'Saving...';
  msg.className = 'save-msg';

  const selectedCats = Array.from(document.querySelectorAll('.cat-check.on')).map(c => c.dataset.cat);

  const payload = {
    title: document.getElementById('f-title').value.trim(),
    title_translit: document.getElementById('f-translit').value.trim() || null,
    language: document.getElementById('f-language').value,
    categories: selectedCats,
    lyrics_original: document.getElementById('f-lyrics-original').value,
    lyrics_translation: document.getElementById('f-lyrics-translation').value || null,
    about: document.getElementById('f-about').value || null,
  };

  // Upload audio first if a new file was chosen
  if(pendingAudioFile){
    const safeName = payload.title.toLowerCase()
      .replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-') || 'untitled';
    const path = `${safeName}-${Date.now()}.mp3`;
    const { error: uploadErr } = await supabaseClient.storage
      .from('Audio')
      .upload(path, pendingAudioFile, { upsert: true });
    if(uploadErr){
      msg.textContent = 'Audio upload failed: ' + uploadErr.message;
      msg.className = 'save-msg err';
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('Audio').getPublicUrl(path);
    payload.audio_url = urlData.publicUrl;
  }

  // Upload cover image if a new one was chosen (writes to the covers bucket)
  if(pendingCoverFile){
    const base = payload.title.toLowerCase()
      .replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-') || 'cover';
    const ext = (pendingCoverFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const path = `${base}-${Date.now()}.${ext}`;
    const { error: coverErr } = await supabaseClient.storage
      .from('covers')
      .upload(path, pendingCoverFile, { upsert: true });
    if(coverErr){
      msg.textContent = 'Cover upload failed: ' + coverErr.message;
      msg.className = 'save-msg err';
      return;
    }
    const { data: coverUrlData } = supabaseClient.storage.from('covers').getPublicUrl(path);
    payload.cover_url = coverUrlData.publicUrl;
  }

  let error;
  if(currentSong.id){
    ({ error } = await supabaseClient.from('songs').update(payload).eq('id', currentSong.id));
  } else {
    ({ error } = await supabaseClient.from('songs').insert(payload));
  }

  if(error){
    msg.textContent = 'Error: ' + error.message;
    msg.className = 'save-msg err';
  } else {
    msg.textContent = 'Saved ✓';
    msg.className = 'save-msg ok';
    pendingAudioFile = null;
    pendingCoverFile = null;
    await syncNewCategories(selectedCats);
    await loadSongs();
    await loadCategories();
    renderCategoryManager();
  }
}

async function deleteSong(){
  if(!confirm('Delete this song? This cannot be undone.')) return;
  const { error } = await supabaseClient.from('songs').delete().eq('id', currentSong.id);
  if(error){ alert('Error: ' + error.message); return; }
  currentSong = null;
  await loadSongs();
  renderCategoryManager();
  renderForm();
}
</script>
</body>
</html>
